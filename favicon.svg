<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmos Background Gradient -->
    <radialGradient id="cosmos-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#131d3f" />
      <stop offset="55%" stop-color="#070b19" />
      <stop offset="100%" stop-color="#03050c" />
    </radialGradient>

    <!-- Outer Badge Rim Gradient (Cyan -> Violet -> Gold) -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Omega (Ω) Emblem Gradient -->
    <linearGradient id="omega-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="52%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Tilted Orbital Ring Gradient -->
    <linearGradient id="orbit-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95" />
    </linearGradient>

    <!-- Core Singularity Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Glow Filter for 16px-512px Clarity -->
    <filter id="cosmic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Badge Base (High contrast on both dark and light browser tabs) -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#cosmos-bg)" stroke="url(#rim-grad)" stroke-width="20" />

  <!-- Subtle Inner Nebula Halo -->
  <circle cx="256" cy="232" r="150" fill="url(#core-glow)" />

  <!-- Background Distant Stars -->
  <circle cx="116" cy="118" r="7" fill="#bae6fd" opacity="0.85" />
  <circle cx="398" cy="134" r="5.5" fill="#fde68a" opacity="0.8" />
  <circle cx="108" cy="378" r="6" fill="#ddd6fe" opacity="0.75" />
  <circle cx="396" cy="388" r="7.5" fill="#00f2fe" opacity="0.85" />

  <!-- Back Arc of Tilted Planetary / Quantum Orbit -->
  <g transform="rotate(-26 256 248)">
    <path d="M 52 248 A 204 68 0 0 1 460 248" fill="none" stroke="#8b5cf6" stroke-width="14" stroke-linecap="round" opacity="0.45" />
  </g>

  <!-- Central Geometric Omega (Ω) Symbol -->
  <path
    d="M 140 376
       L 208 376
       L 208 338
       C 166 314 142 268 142 216
       C 142 138 192 84 256 84
       C 320 84 370 138 370 216
       C 370 268 346 314 304 338
       L 304 376
       L 372 376"
    fill="none"
    stroke="url(#omega-grad)"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#cosmic-glow)"
  />

  <!-- Central Quasar / Quantum Singularity Star inside the Omega Arch -->
  <path
    d="M 256 164
       Q 256 214 306 214
       Q 256 214 256 264
       Q 256 214 206 214
       Q 256 214 256 164 Z"
    fill="#fbbf24"
  />
  <circle cx="256" cy="214" r="12" fill="#ffffff" />

  <!-- Front Arc of Tilted Planetary / Quantum Orbit (Crosses over Omega for 3D depth) -->
  <g transform="rotate(-26 256 248)">
    <path d="M 460 248 A 204 68 0 0 1 52 248" fill="none" stroke="url(#orbit-grad)" stroke-width="18" stroke-linecap="round" />
    <!-- Orbiting Quantum / Exoplanet Node -->
    <circle cx="110" cy="296" r="20" fill="#03050c" stroke="#00f2fe" stroke-width="10" />
    <circle cx="110" cy="296" r="8" fill="#ffffff" />
    <!-- Opposite Apoapsis Gold Node -->
    <circle cx="436" cy="216" r="13" fill="#fbbf24" />
  </g>
</svg>